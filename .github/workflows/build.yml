name: Build Releases

on:
  push:
    tags:
      - 'v*'  # 当推送 v1.0.0 这样的 tag 时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: EtsyScraper-macOS
          - os: windows-latest
            name: Windows
            artifact: EtsyScraper-Windows

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry to use in-project venv
        run: poetry config virtualenvs.in-project true

      - name: Load cached venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Verify build hooks exist
        # Windows runner 默认用 PowerShell，显式指定 bash 以跨平台复用同一套语法
        shell: bash
        run: |
          echo "Checking build_hooks directory..."
          ls -la build_hooks/
          echo "Verifying hook files..."
          test -f build_hooks/hook-etsy_scraper.py || { echo "❌ Missing hook-etsy_scraper.py"; exit 1; }
          test -f build_hooks/hook-runtime_fix.py || { echo "❌ Missing hook-runtime_fix.py"; exit 1; }
          echo "✅ Build hooks verified"

      - name: Build with PyInstaller
        run: poetry run python build.py

      - name: Verify Windows build output
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "Checking dist/EtsyScraper..."
          ls -la dist/EtsyScraper/ 2>/dev/null || { echo "❌ dist/EtsyScraper not found"; exit 1; }
          echo ""
          echo "Checking _multiprocessing.pyd..."
          find dist/EtsyScraper -name "_multiprocessing*" 2>/dev/null || echo "  (not found)"
          echo ""
          echo "Checking _overlapped.pyd..."
          find dist/EtsyScraper -name "_overlapped*" 2>/dev/null || echo "  (not found)"
          echo ""
          echo "Checking python311.dll..."
          find dist/EtsyScraper -name "python311*" 2>/dev/null || echo "  (not found)"

      - name: Prepare macOS artifact
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r EtsyScraper-macOS.zip EtsyScraper.app

      - name: Prepare Windows artifact
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path EtsyScraper -DestinationPath EtsyScraper-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
