name: Build Releases

on:
  push:
    tags:
      - 'v*'  # 当推送 v1.0.0 这样的 tag 时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: EtsyScraper-macOS
          - os: windows-latest
            name: Windows
            artifact: EtsyScraper-Windows

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry to use in-project venv
        run: poetry config virtualenvs.in-project true

      - name: Load cached venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Verify build hooks exist
        run: |
          echo "Checking build_hooks directory..."
          ls -la build_hooks/
          echo "Verifying hook files..."
          test -f build_hooks/hook-etsy_scraper.py
          test -f build_hooks/hook-runtime_fix.py
          echo "✅ Build hooks verified"

      - name: Build with PyInstaller
        run: poetry run python build.py

      - name: Verify Windows build output
        if: matrix.os == 'windows-latest'
        run: |
          echo "Checking dist/EtsyScraper..."
          ls -la dist/EtsyScraper/
          echo ""
          echo "Checking _multiprocessing.pyd..."
          if (Test-Path "dist/EtsyScraper/_internal/_multiprocessing.pyd") {
            echo "✅ _multiprocessing.pyd found in _internal"
          } elseif (Test-Path "dist/EtsyScraper/_internal/_multiprocessing.pyd") {
            echo "✅ _multiprocessing.pyd found"
          } else {
            echo "⚠️  _multiprocessing.pyd not found in expected locations"
            echo "Searching for _multiprocessing..."
            Get-ChildItem -Path dist/EtsyScraper -Recurse -Name "_multiprocessing*"
          }
          echo ""
          echo "Checking _overlapped.pyd..."
          Get-ChildItem -Path dist/EtsyScraper -Recurse -Name "_overlapped*" -ErrorAction SilentlyContinue
          echo ""
          echo "Checking python311.dll..."
          Get-ChildItem -Path dist/EtsyScraper -Recurse -Name "python311*" -ErrorAction SilentlyContinue

      - name: Prepare macOS artifact
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r EtsyScraper-macOS.zip EtsyScraper.app

      - name: Prepare Windows artifact
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path EtsyScraper -DestinationPath EtsyScraper-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
